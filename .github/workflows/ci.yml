name: CI

# Quality gate. Runs on every pull request and on pushes to the main branches.
# The merge is blocked when lint, tests, coverage or build fail.
on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Validate GPU preview launcher commands (Node.js)
        run: node --test ow/scripts/gpu-preview.test.mjs ow/scripts/stage-native-assets.test.mjs

      - name: Tests + coverage (Vitest, fails under thresholds)
        run: npm run coverage

      - name: Build (web)
        run: npm run build

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

  # OW gate: build the OW compiler from upstream, resolve dependencies.yml
  # (@flow / @math / @owunit / @engine / @graphics) and run the OWUnit suites,
  # including the new headless engine + existing-game integration tests.
  ow-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build the OW compiler (ow-lang)
        run: |
          git clone --depth 1 https://github.com/OW-Programing-Language/ow-lang /tmp/ow-lang
          mvn -q -DskipTests -f /tmp/ow-lang/pom.xml package
          JAR=$(ls /tmp/ow-lang/target/OwIDE.jar)
          echo "OW_JAR=$JAR" >> "$GITHUB_ENV"

      - name: Resolve OW dependencies (ow deps install)
        working-directory: ow
        run: java -jar "$OW_JAR" deps install

      - name: Run OWUnit module tests
        working-directory: ow
        run: java -jar "$OW_JAR" test tests/
