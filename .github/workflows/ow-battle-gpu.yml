name: OW Battle OpenGL Smoke

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-battle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CodeWash
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build OW compiler and install Maven artifacts
        run: |
          git clone --quiet https://github.com/OW-Programing-Language/ow-lang.git /tmp/ow-battle-lang
          mvn -B -q -f /tmp/ow-battle-lang/pom.xml -DskipTests install
      - name: Resolve pinned OW dependencies
        working-directory: ow
        run: |
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar deps install
          git diff --exit-code -- dependencies.lock.yml
      - name: Stage original PNG assets inside OW Graphics image sandbox
        run: node ow/scripts/stage-native-assets.mjs

      - name: Check OW GPU examples
        working-directory: ow
        run: |
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/battle_gpu.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/battle_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/battle_lifecycle_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/menu_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/reading_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/writing_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/cleaning_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/memory_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/patterns_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/native_art_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/menu_texture_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/menu_widescreen_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/menu_carousel_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/menu_rich_cards_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/menu_polish_smoke.ow
          java -jar /tmp/ow-battle-lang/target/OwIDE.jar check src/engine/menu_pointer_smoke.ow
      - name: Build pinned OW Graphics native extension
        run: |
          git clone --quiet --no-checkout https://github.com/OW-Programing-Language/OW-Graphics.git /tmp/ow-battle-graphics
          git -C /tmp/ow-battle-graphics checkout --quiet 08f633185966f80751e8aae9063163e10b86e8d3
          mvn -B -q -f /tmp/ow-battle-graphics/native-bridge/pom.xml package dependency:copy-dependencies -DoutputDirectory=target/lib
      - name: Install Mesa/Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libgl1 libxcursor1 libxi6 libxrandr2 libxinerama1
      - name: Compile CI-only framebuffer probe
        run: |
          mkdir -p ow/target/probe-classes/META-INF/services
          javac -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*" \
            -d ow/target/probe-classes ow/tests/gpu/FramebufferProbe.java
          cp ow/tests/gpu/META-INF/services/dev.oreo.RuntimeExtension \
            ow/target/probe-classes/META-INF/services/dev.oreo.RuntimeExtension
      - name: Verify native HUD glyphs, answer selection and combat pixels
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/battle_smoke.ow

      - name: Verify two independent native OpenGL sessions and GPU resource cleanup
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*" \
            dev.oreo.Main run src/engine/battle_lifecycle_smoke.ow

      - name: Verify native main menu, six activity entries and scene transitions
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_smoke.ow

      - name: Verify native Reading word options, ECS isolation and framebuffer
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/reading_smoke.ow

      - name: Verify virtual spelling keyboard, Writing ECS battle and framebuffer
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/writing_smoke.ow

      - name: Verify Cleaning task acknowledgement and real Mesa framebuffer
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/cleaning_smoke.ow

      - name: Verify native Memory matching, real Mesa framebuffer and ECS isolation
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/memory_smoke.ow

      - name: Verify native Patterns study/recall and actual Mesa framebuffer
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/patterns_smoke.ow

      - name: Verify original textured art, idle/hit animation and framebuffer
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/native_art_smoke.ow

      - name: Verify themed native OW menu textures and animations under Mesa
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1024x768x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_texture_smoke.ow

      - name: Verify 1280x720 menu chrome, centered feature card and pixel hearts
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_widescreen_smoke.ow

      - name: Verify eased six-card carousel transitions on real Mesa framebuffer
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_carousel_smoke.ow

      - name: Verify six original-themed native activity cards, live HP and CTA on Mesa
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_rich_cards_smoke.ow

      - name: Verify compact native typography and real PNG aspect fitting under Mesa
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_polish_smoke.ow

      - name: Verify native pointer hitboxes and GPU hover glow on real Mesa
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_pointer_smoke.ow

      - name: Verify original mob portraits and five-card visual parity on Mesa
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_visual_parity_smoke.ow

      - name: Verify Electron toolbar settings/themes/bug and fitted labels on Mesa
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_toolbar_smoke.ow

      - name: Verify exact Electron Cubes material, six CSS gradients and shader resource cleanup
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_materials_smoke.ow

      - name: Verify licensed VT323 glyph atlas and mixed-case labels on Mesa
        working-directory: ow
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            java -cp "/tmp/ow-battle-lang/target/OwIDE.jar:/tmp/ow-battle-graphics/native-bridge/target/classes:/tmp/ow-battle-graphics/native-bridge/target/lib/*:target/probe-classes" \
            dev.oreo.Main run src/engine/menu_font_smoke.ow
